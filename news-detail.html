        <script>
      function timeAgo(postDate) {
          const now = new Date();
          const diff = now - new Date(postDate);
          const seconds = Math.floor(diff / 1000);
          const minutes = Math.floor(seconds / 60);
          const hours = Math.floor(minutes / 60);
          const days = Math.floor(hours / 24);

          if (days > 0) return `${days} day${days > 1 ? "s" : ""} ago`;
          if (hours > 0) return `${hours} hour${hours > 1 ? "s" : ""} ago`;
          if (minutes > 0) return `${minutes} minute${minutes > 1 ? "s" : ""} ago`;
          return `Just now`;
      }

        <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Prüfen, ob die Seite "news-detail.html" ist
            if (window.location.pathname.includes("news-detail.html")) {

                // Kommentarbereich ein-/ausblenden
                document.getElementById("commentToggle").addEventListener("click", function(event) {
                    event.preventDefault();
                    let comments = document.getElementById("commentsSection");
                    comments.style.display = (comments.style.display === "none") ? "block" : "none";
                });

                // Funktion zum Hinzufügen eines Kommentars
                function addComment() {
                    let nameInput = document.getElementById("commentName");
                    let commentInput = document.getElementById("commentInput");
                    let nameText = nameInput.value.trim();
                    let commentText = commentInput.value.trim();

                    if (nameText === "" || commentText === "") return; // Verhindert leere Eingaben

                    // Neues Kommentar-Element mit Styling erstellen
                    let commentDiv = document.createElement("div");
                    commentDiv.classList.add("comment");
                    commentDiv.innerHTML = `<strong>${nameText}:</strong> ${commentText}`;

                    // Kommentar zur Liste hinzufügen
                    document.getElementById("commentList").appendChild(commentDiv);

                    // Eingabefelder leeren
                    nameInput.value = "";
                    commentInput.value = "";

                    // Anzahl der Kommentare aktualisieren
                    updateCommentCount();
                }

                // Funktion zum Aktualisieren der Kommentaranzahl
                function updateCommentCount() {
                    let comments = document.getElementById("commentList").children.length;
                    document.getElementById("commentCount").innerText = comments;
                }

                // Klick-Event für den Post-Button verbinden
                document.querySelector(".comment-button").addEventListener("click", addComment);

                // Falls Enter-Taste gedrückt wird, Kommentar absenden
                document.getElementById("commentInput").addEventListener("keypress", function(event) {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        addComment();
                    }
                });

                document.getElementById("commentName").addEventListener("keypress", function(event) {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        document.getElementById("commentInput").focus(); // Springt zum nächsten Eingabefeld
                    }
                });
            }
        });
        </script>
